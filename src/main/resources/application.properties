spring.application.name=Yomio
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.general-per-minute=${RATE_LIMIT_GENERAL_PER_MINUTE:120}
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
app.password-reset.smtp-enabled=${PASSWORD_RESET_SMTP_ENABLED:false}
app.password-reset.from=${PASSWORD_RESET_FROM:}
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-none}] %logger{36} - %msg%n
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

app.catalog.refresh-cron=${CATALOG_REFRESH_CRON:0 0 4 * * SUN}
app.catalog.refresh-pages=${CATALOG_REFRESH_PAGES:2}
app.catalog.anime-refresh-pages=${CATALOG_ANIME_REFRESH_PAGES:10}
app.catalog.releasing-refresh-pages=${CATALOG_RELEASING_REFRESH_PAGES:10}
app.catalog.manhwa-refresh-pages=${CATALOG_MANHWA_REFRESH_PAGES:10}
app.catalog.refresh-page-size=${CATALOG_REFRESH_PAGE_SIZE:50}
app.catalog.anilist-min-interval-ms=${ANILIST_MIN_INTERVAL_MS:2100}
app.catalog.anilist-rate-limit-retries=${ANILIST_RATE_LIMIT_RETRIES:2}
app.catalog.kitsu-refresh-pages=${KITSU_REFRESH_PAGES:3}
app.catalog.refresh-on-startup=${CATALOG_REFRESH_ON_STARTUP:false}
app.catalog.refresh-on-startup-type=${CATALOG_REFRESH_ON_STARTUP_TYPE:}
app.catalog.release-audit-on-startup=${CATALOG_RELEASE_AUDIT_ON_STARTUP:false}
