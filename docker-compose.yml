services:
  postgres:
    image: postgres:16
    container_name: daytracker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-yomio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yomio} -d ${POSTGRES_DB:-tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: daytracker-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tracker}
      DB_USERNAME: ${POSTGRES_USER:-yomio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FORWARD_HEADERS_STRATEGY: native
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_MAIL_FROM: ${BREVO_MAIL_FROM:-}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-http://localhost:5173/reset-password}
      CATALOG_REFRESH_ON_STARTUP: "true"
      CATALOG_REFRESH_PAGES: "2"
      CATALOG_ANIME_REFRESH_PAGES: "10"
      CATALOG_RELEASING_REFRESH_PAGES: "10"
      CATALOG_MANHWA_REFRESH_PAGES: "10"
      CATALOG_REFRESH_PAGE_SIZE: "50"
      ANILIST_MIN_INTERVAL_MS: "2100"
      ANILIST_RATE_LIMIT_RETRIES: "2"
      KITSU_REFRESH_PAGES: "3"
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: daytracker-frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres-data:
